[package]
name = "membli"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/Btocode/membli"
edition = "2021"
description = "Membli: a sci-fi control center for an Ubuntu PC: live health, freeze detection, history, cleanup, Claude insights"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
rusqlite = { version = "0.42", features = ["bundled"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "7"
anyhow = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
